version: "3.9"

# Girinka Pulse — RabbitMQ as Celery broker.
# PostgreSQL for application DB. File storage: Cloudinary. Email: Resend.

services:

  db:
    image: postgres:15-alpine
    container_name: girinka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       girinka-pulse-db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: Walmond@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-alpine
    container_name: girinka-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: girinka
      RABBITMQ_DEFAULT_PASS: girinka123
    ports:
      - "5672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: .
    container_name: girinka-api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - /app/venv
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=girinka.settings.development
      - DB_HOST=db
      - CELERY_BROKER_URL=amqp://girinka:girinka123@rabbitmq:5672//
      - PYTHONUNBUFFERED=1
      - WATCHMAN_AVAILABLE=false
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: girinka-worker
    restart: unless-stopped
    command: celery -A girinka worker -l info -c 4 --without-gossip --without-mingle --pool=solo
    volumes:
      - .:/app
      - /app/venv
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=girinka.settings.development
      - DB_HOST=db
      - CELERY_BROKER_URL=amqp://girinka:girinka123@rabbitmq:5672//
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: girinka-beat
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate django_celery_beat &&
             celery -A girinka beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - .:/app
      - /app/venv
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=girinka.settings.development
      - DB_HOST=db
      - CELERY_BROKER_URL=amqp://girinka:girinka123@rabbitmq:5672//
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
